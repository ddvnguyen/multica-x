name: Nightly

# The jobs the PR path no longer pays for (M-161): the -race Go suite, the
# platform jobs and the vulnerability scan. schedule/dispatch only, no path
# filter — every run validates everything it carries. This file must land in
# the same PR that removes `schedule:` from ci.yml, or nightly coverage gaps.
# Nightly jobs stay on hosted runners: schedule/dispatch never selects the
# self-hosted pool (see decideRunner in scripts/ci-scope.mjs).

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:

  # The Go caches are handled explicitly here rather than through setup-go's
  # `cache: true`. setup-go keys its entry on go.sum alone and shares that key
  # with every Linux job in this workflow, so whichever job finished first,
  # go-vulnerability-scan in under a minute, saved a ~95 MB entry holding
  # little beyond module downloads; this job then "hit" that key on every run
  # and never saved its own. The result was a from-scratch race-instrumented
  # compile of the whole module on every backend run, measured at roughly
  # half of the job's ~8 minutes (MUL-7280).
  #
  # Two entries now. The module cache is keyed by go.sum: immutable, saved on
  # a miss, never grows. The build cache is keyed by commit SHA with a prefix
  # fallback, so each run starts from the newest entry and recompiles only
  # what its change touched. Only this nightly workflow publishes a race-mode
  # build-cache entry (M-161: the PR path compiles without -race), so storage
  # churn is one entry per night. The key carries the resolved Go version
  # because `check-latest` floats across patch releases,
  # and the runner image (ImageOS) because cached cgo and race objects are
  # linked against that image's glibc: when ubuntu-latest moves to a new
  # release, an entry built on the old one must not be restored. setup-go
  # keys on ImageOS for the same reason (actions/setup-go#368).
  #
  # A rolling entry only grows on its own: each save is the restored entry
  # plus this commit's objects, and Go trims only what has sat unused for
  # five days, so the entry carried every recent main commit's race objects.
  # It reached 3.5 GB in ten days, and restoring and saving it cost more than
  # the compile it saved (MUL-7547). Before saving, the job therefore drops
  # every entry this run did not use, leaving the next run the objects of the
  # tree it is most likely to build.
  #
  # This job is the only writer of the race-mode entries; the PR-path jobs in
  # ci.yml compile without -race and publish under their own prefixes, so the
  # two key families never touch.
  #
  # Every compile below runs in race mode so build, vet and test share one set
  # of objects. A plain `go build` fed nothing to the -race test binaries and
  # was pure duplicate work; nothing in server/ carries a `race` build tag, so
  # both modes accept exactly the same code.
  #
  # `GOFLAGS=-count=1` because a rolling cache would otherwise let `go test`
  # replay cached results. Migrations are read from disk at run time rather
  # than embedded, so a schema change is invisible to a test binary's hash and
  # a cached "ok" from an untouched package could mask a real failure.
  backend-race:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Job-level filtering skips both services on unrelated changes.
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: multica
          POSTGRES_USER: multica
          POSTGRES_PASSWORD: multica
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U multica -d multica"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://multica:multica@localhost:5432/multica?sslmode=disable
      # Wires up the RedisLocalSkill*_test.go suite. Distinct from REDIS_URL
      # (which would flip the server binary itself onto the Redis-backed
      # realtime relay + request stores); the tests talk to this Redis
      # directly so they run alongside the Postgres-backed suite.
      REDIS_TEST_URL: redis://localhost:6379/1
      GOFLAGS: -count=1
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Go
        id: go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          # Keep the security floor even when the setup-go manifest lags;
          # continue accepting newer patches within Go 1.27.
          go-version: "~1.27.3"
          check-latest: true
          cache: false

      # Restore-only: backend-build in ci.yml is the module cache's single
      # writer (M-161), so no job can pin the immutable go.sum key to a
      # partial download. On a cold key this job just downloads what it needs.
      - name: Restore Go module cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/go/pkg/mod
          key: go-mod-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('server/go.sum') }}

      # ImageOS is a runner environment variable, not a context value, so a
      # shell step spells the build-cache key prefix once for restore and save.
      - name: Resolve Go build cache key
        id: gocache
        run: echo "prefix=go-build-race-${{ runner.os }}-${{ runner.arch }}-$ImageOS-${{ steps.go.outputs.go-version }}-" >> "$GITHUB_OUTPUT"

      - name: Restore Go build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/go-build
          key: ${{ steps.gocache.outputs.prefix }}${{ github.sha }}
          restore-keys: ${{ steps.gocache.outputs.prefix }}

      # Go refreshes a cache entry's mtime when it uses it, but only once that
      # mtime is an hour old. So after the run, an entry no newer than an hour
      # before the first compile is one this run did not use. The prune step
      # before the save compares against this marker.
      - name: Mark Go build cache epoch
        id: goepoch
        run: touch -d '-1 hour' "$RUNNER_TEMP/go-build-epoch"

      - name: Build
        run: cd server && go build -race ./...

      # The `agentintegration` files execute real agent CLIs, so no CI job runs
      # them. Nothing compiled them either, which let them rot silently: a
      # helper renamed in an ordinary test file, or two branches each defining
      # the same helper in one package, breaks the tagged build with every
      # untagged job still green. vet type-checks test files, so this is the
      # cheapest gate that keeps them honest without needing an agent CLI.
      - name: Vet tag-gated agent integration tests
        run: cd server && go vet -race -tags agentintegration ./...

      - name: Run migrations
        run: cd server && go run ./cmd/migrate up

      - name: Verify Go test wrapper
        run: bash scripts/test-go.test.sh

      - name: Test
        # Nightly runs both halves in one job: regular packages first, then
        # pkg/agent throttled (see scripts/test-go.sh).
        run: bash scripts/test-go.sh --race

      # Go's own trim (cmd/go/internal/cache) with this run as the window
      # instead of five days: only `-a`/`-d` entries, and an executable entry
      # is a directory, so it goes whole. See the job comment.
      - name: Prune Go build cache to this run's entries
        if: ${{ !cancelled() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && steps.goepoch.outcome == 'success' }}
        run: |
          du -sh ~/.cache/go-build
          find ~/.cache/go-build -mindepth 2 -maxdepth 2 \( -name '*-a' -o -name '*-d' \) \
            ! -newer "$RUNNER_TEMP/go-build-epoch" -exec rm -rf {} +
          du -sh ~/.cache/go-build

      # Publishes on the nightly run (the race prefix's only writer);
      # `!cancelled()` so a red run still refreshes the objects for the next
      # one, and the key step's outcome so a run that never reached Go does
      # not save an empty entry under a half-formed key.
      - name: Save Go build cache
        if: ${{ !cancelled() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && steps.gocache.outcome == 'success' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/go-build
          key: ${{ steps.gocache.outputs.prefix }}${{ github.sha }}


  # Keep the live vulnerability database from hiding build and test results.
  # No merge gate here: nightly failures surface as the workflow run itself.
  go-vulnerability-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          # Keep the security floor even when the setup-go manifest lags;
          # continue accepting newer patches within Go 1.27.
          go-version: "~1.27.3"
          check-latest: true
          cache-dependency-path: server/go.sum

      - name: Scan Go vulnerabilities
        working-directory: server
        run: go tool govulncheck ./...

  installer:
    # Stub-driven shell tests for scripts/install.sh (Linux-only since M-324;
    # the PowerShell suite and the macOS/BSD shell differences are out of the
    # web-app CI scope).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Test shell installers
        run: bash scripts/install.test.sh
