name: Deploy Multica (main-multica stack)

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Immutable image tag to build or use from the host
        required: true
        type: string
      source_ref:
        description: Source branch, single-component tag (multica-moct or refs/tags/<tag>), or full 40-char commit SHA for a unified release (M-556)
        required: true
        default: multica-moct
        type: string
      drain_timeout_seconds:
        description: Max seconds to wait for active daemon tasks before cancelling them; 0 = no wait, cancel and deploy immediately
        required: true
        default: "0"
        type: string
      image_source:
        description: Build images on this host or use images already staged there
        required: true
        default: build
        type: choice
        options:
          - build
          - staged
      force:
        description: Stop the daemon and cancel remaining tasks after the drain timeout
        required: true
        default: false
        type: boolean
      dry_run:
        description: Run preflight and print the complete plan without changing the stack
        required: true
        default: false
        type: boolean

run-name: Deploy Multica ${{ inputs.image_tag }} from ${{ inputs.source_ref }} (drain=${{ inputs.drain_timeout_seconds }}s, force=${{ inputs.force }}, dry_run=${{ inputs.dry_run }})

concurrency:
  group: multica-main-production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate dispatch inputs and refs
    runs-on: [self-hosted, linux, x64, multica-main]
    timeout-minutes: 2
    steps:
      - name: Checkout branch head for comparison
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: multica-moct
          fetch-depth: 0
          fetch-tags: true
      - name: Reject disallowed dispatch ref and invalid inputs
        id: resolve
        env:
          DISPATCH_REF: ${{ github.ref }}
          SOURCE_REF: ${{ inputs.source_ref }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          DRAIN_TIMEOUT: ${{ inputs.drain_timeout_seconds }}
          IMAGE_SOURCE: ${{ inputs.image_source }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          [[ "$DISPATCH_REF" == "refs/heads/multica-moct" || "$DISPATCH_REF" =~ ^refs/tags/[A-Za-z0-9][A-Za-z0-9._-]*$ ]] || {
            echo "::error::dispatch only from multica-moct or a tag"; exit 1;
          }
          # M-556: a unified release pins one SHA for production and lane z.
          # source_ref accepts multica-moct, a tag, or a full 40-char commit
          # SHA (release mode: the exact SHA Lead approved).
          if [[ "$SOURCE_REF" =~ ^[0-9a-fA-F]{40}$ ]]; then
            git cat-file -e "$SOURCE_REF^{commit}" 2>/dev/null || {
              echo "::error::source_ref SHA not found on multica-moct"; exit 1;
            }
            # The release SHA must already sit on multica-moct history so a
            # foreign commit can never ship: it has to be merged first, which
            # is what ran green CI on the branch. (The green-run gate itself
            # lives in the green-ci job on ubuntu-latest, where gh is
            # preinstalled; the self-hosted pool is not assumed to have it.)
            git merge-base --is-ancestor "$SOURCE_REF" HEAD || {
              echo "::error::source_ref SHA is not an ancestor of multica-moct; merge it first"; exit 1;
            }
            printf 'commit=%s\n' "$SOURCE_REF" >> "$GITHUB_OUTPUT"
          elif [[ "$SOURCE_REF" != "multica-moct" ]]; then
            [[ "$SOURCE_REF" =~ ^refs/tags/[A-Za-z0-9][A-Za-z0-9._-]*$ ]] || {
              echo "::error::source_ref must be multica-moct or refs/tags/<tag>"; exit 1;
            }
            git check-ref-format "$SOURCE_REF" || {
              echo "::error::source_ref is not a valid Git ref"; exit 1;
            }
          fi
          [[ "$IMAGE_TAG" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$ ]] || {
            echo "::error::image_tag is invalid"; exit 1;
          }
          [[ "$DRAIN_TIMEOUT" =~ ^[0-9]+$ ]] || {
            echo "::error::drain_timeout_seconds must be a non-negative integer (0 = cancel tasks and deploy immediately)"; exit 1;
          }
          if [[ "$DRY_RUN" == "true" && "$IMAGE_SOURCE" != "staged" ]]; then
            echo "::error::dry_run requires image_source=staged so it does not build or mutate host images"; exit 1
          fi

  # M-556: a SHA release ships only with a green CI push run on multica-moct —
  # otherwise lane z has no artifacts to install for it. Pull-request runs do
  # not count (they publish no artifacts). Runs on ubuntu-latest, where gh is
  # preinstalled. Branch/tag dispatches keep the previous behavior (no gate).
  green-ci:
    name: Require green CI on the release SHA
    needs: validate
    if: ${{ needs.validate.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: multica-moct
          fetch-depth: 1
      - name: Check for a successful push run of CI on the SHA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ci-green-run.sh "${{ github.repository }}" CI multica-moct "${{ inputs.source_ref }}"

  deploy:
    name: Deploy Multica stack (drain=${{ inputs.drain_timeout_seconds }}s, force=${{ inputs.force }})
    needs: [validate, green-ci]
    if: ${{ needs.validate.result == 'success' && needs.green-ci.result == 'success' }}
    runs-on: [self-hosted, linux, x64, multica-main]
    timeout-minutes: 180
    environment:
      name: main-prod
    outputs:
      commit: ${{ steps.buildmeta.outputs.commit }}
      image_tag: ${{ inputs.image_tag }}
    env:
      TMPDIR: /mnt/workspace/tmp/multica-main-actions
    steps:
      - name: Prepare workspace temp directory
        run: mkdir -p "$TMPDIR"

      - name: Checkout selected source ref
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0

      - name: Resolve expected commit and compose image names
        id: buildmeta
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          SOURCE_REF: ${{ inputs.source_ref }}
          IMAGE_SOURCE: ${{ inputs.image_source }}
          FORCE: ${{ inputs.force }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          commit="$(git rev-parse HEAD)"
          stack_env="$HOME/.local/share/multica/.env"
          test -f "$stack_env"
          read_value() {
            local key="$1" value
            value="$(awk -F= -v key="$key" '$1 == key {sub(/^[^=]*=/, ""); print; found++} END {if (found > 1) exit 2}' "$stack_env")"
            value="${value%\"}"; value="${value#\"}"
            value="${value%\'}"; value="${value#\'}"
            printf '%s' "$value"
          }
          backend="$(read_value MULTICA_BACKEND_IMAGE)"
          web="$(read_value MULTICA_WEB_IMAGE)"
          backend="${backend:-ghcr.io/multica-ai/multica-backend}"
          web="${web:-ghcr.io/multica-ai/multica-web}"
          [[ "$backend" =~ ^[A-Za-z0-9./:_-]+$ ]] || { echo "::error::invalid backend image repository"; exit 1; }
          [[ "$web" =~ ^[A-Za-z0-9./:_-]+$ ]] || { echo "::error::invalid web image repository"; exit 1; }
          printf 'commit=%s\nbackend=%s\nweb=%s\n' "$commit" "$backend" "$web" >> "$GITHUB_OUTPUT"
          {
            printf '### Main deployment approval summary\n\n'
            printf -- '- Image tag: `%s`\n- Source ref: `%s`\n- Commit: `%s`\n- Image source: `%s`\n- Force (cancel remaining tasks after drain timeout): `%s`\n- Dry run: `%s`\n' \
              "$IMAGE_TAG" "$SOURCE_REF" "$commit" "$IMAGE_SOURCE" "$FORCE" "$DRY_RUN"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build and tag backend and web images
        if: ${{ inputs.image_source == 'build' && !inputs.dry_run }}
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          COMMIT: ${{ steps.buildmeta.outputs.commit }}
          BACKEND_REPO: ${{ steps.buildmeta.outputs.backend }}
          WEB_REPO: ${{ steps.buildmeta.outputs.web }}
        run: |
          set -euo pipefail
          podman build -f Dockerfile \
            --build-arg VERSION="$IMAGE_TAG" --build-arg COMMIT="$COMMIT" \
            --label "org.opencontainers.image.revision=$COMMIT" \
            --label "org.opencontainers.image.version=$IMAGE_TAG" \
            -t "$BACKEND_REPO:$IMAGE_TAG" .
          podman build -f Dockerfile.web \
            --build-arg NEXT_PUBLIC_APP_VERSION="$IMAGE_TAG" \
            --label "org.opencontainers.image.revision=$COMMIT" \
            --label "org.opencontainers.image.version=$IMAGE_TAG" \
            -t "$WEB_REPO:$IMAGE_TAG" .

      - name: Confirm staged images
        if: ${{ inputs.image_source == 'staged' || inputs.dry_run }}
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          COMMIT: ${{ steps.buildmeta.outputs.commit }}
          BACKEND_REPO: ${{ steps.buildmeta.outputs.backend }}
          WEB_REPO: ${{ steps.buildmeta.outputs.web }}
        run: |
          set -euo pipefail
          for image in "$BACKEND_REPO:$IMAGE_TAG" "$WEB_REPO:$IMAGE_TAG"; do
            podman image exists "$image"
            test "$(podman image inspect --format '{{ index .Labels "org.opencontainers.image.revision" }}' "$image")" = "$COMMIT"
            test "$(podman image inspect --format '{{ index .Labels "org.opencontainers.image.version" }}' "$image")" = "$IMAGE_TAG"
          done

      - name: Deploy, verify, and roll back on failure
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          EXPECTED_COMMIT: ${{ steps.buildmeta.outputs.commit }}
          DRAIN_TIMEOUT: ${{ inputs.drain_timeout_seconds }}
          FORCE: ${{ inputs.force }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          args=("$IMAGE_TAG" "$EXPECTED_COMMIT" "$DRAIN_TIMEOUT")
          if [[ "$FORCE" == "true" ]]; then args+=(--force); fi
          if [[ "$DRY_RUN" == "true" ]]; then args+=(--dry-run); fi
          bash scripts/deploy-main.sh "${args[@]}"

  # M-556: one release = one SHA. After production is green on the new SHA,
  # move the `production` tag to it. Lane z autodeploy follows this tag —
  # never the branch head — so both sides converge on the same commit.
  # A lane z failure never rolls back production: this job already succeeded,
  # and the lane retries the pinned SHA on its own timer. Rollback is a new
  # release run with the previous SHA (production rollback itself is
  # unchanged: deploy-main.sh restores .env + daemon binary on failure).
  pin-production:
    name: Pin production tag for lane z
    needs: [validate, deploy]
    if: ${{ needs.deploy.result == 'success' && inputs.dry_run != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Move production tag to the deployed commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT: ${{ needs.deploy.outputs.commit }}
          IMAGE_TAG: ${{ needs.deploy.outputs.image_tag }}
        run: |
          set -euo pipefail
          [[ "$COMMIT" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "::error::no deployed commit to pin"; exit 1; }
          gh api "repos/${{ github.repository }}/git/refs/tags/production" \
            --jq .object.sha >/dev/null 2>&1 && exists=1 || exists=0
          if [ "$exists" = 1 ]; then
            gh api --method PATCH "repos/${{ github.repository }}/git/refs/tags/production" \
              -f sha="$COMMIT" -f force=true >/dev/null
          else
            gh api --method POST "repos/${{ github.repository }}/git/refs" \
              -f ref=refs/tags/production -f sha="$COMMIT" >/dev/null
          fi
          {
            printf '### Unified release\n\n'
            printf -- '- Production: `%s` at commit `%s`\n' "$IMAGE_TAG" "$COMMIT"
            printf -- '- Lane z pin: tag `production` now points at `%s`\n' "$COMMIT"
            printf -- '- Lane z picks the pin up within ~60s (autodeploy timer).\n'
            printf -- '- Verify: `/health` commit on :3702 and `:4390 /multica/health` must match.\n'
            printf -- '- Rollback: re-run this workflow with the previous SHA; production rollback itself is unchanged.\n'
          } >> "$GITHUB_STEP_SUMMARY"
